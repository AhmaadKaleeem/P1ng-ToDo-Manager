name: todow
description: Personal student productivity — tasks, reminders, focus, timetable.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  intl: ^0.20.2
  file_picker: ^8.1.7
  uuid: ^4.5.1
  sqflite_common_ffi_web: ^0.4.5+4
  sqflite_common: ^2.5.4+6
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  provider: ^6.1.5+1
  flutter_animate: ^4.5.2
  flutter_slidable: ^4.0.3
  shared_preferences: ^2.5.3
  open_filex: ^4.7.0
  crypto: ^3.0.7
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/todow_logo.jpg"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F5F1EA"
  image: "assets/Tofow-App-Logo-Inapp.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
  shaders:
    - shaders/void.frag
